<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.55" stop-color="#0b2a4e"/>
      <stop offset="1" stop-color="#102f52"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#c71f37"/>
      <stop offset="1" stop-color="#7f1020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#061f49"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#1d7f50"/>
      <stop offset="1" stop-color="#0f4e31"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#9f6c08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;font-weight:900;fill:#fff}
      .sub{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#d9e8ff}
      .h{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;font-weight:800;fill:#111827}
      .t{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#344054}
      .w{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#fff}
      .mono{font-family:SFMono-Regular,Menlo,monospace;fill:#526070}
      .small{font-size:25px}
      .body{font-size:29px}
      .label{font-size:34px;font-weight:900}
    </style>
  </defs>
  <rect width="1400" height="1900" fill="url(#bg)"/>
  <circle cx="140" cy="70" r="260" fill="#f5b942" opacity=".18"/>
  <circle cx="1200" cy="140" r="310" fill="#c71f37" opacity=".18"/>

  <text x="70" y="115" class="title" font-size="72">Automation Command Map</text>
  <text x="72" y="165" class="sub" font-size="30">Gullicksen Realty + Daphne Love Entertainment</text>
  <text x="72" y="205" class="sub" font-size="24">Verified from local docs/config on 2026-07-15</text>

  <g filter="url(#shadow)">
    <rect x="70" y="260" width="290" height="250" rx="28" fill="#fff"/>
    <rect x="70" y="260" width="290" height="12" rx="6" fill="#f5b942"/>
    <text x="100" y="325" class="h label">Mike</text>
    <text x="100" y="363" class="mono small">Final approval</text>
    <text x="100" y="415" class="t body">Approves money,</text>
    <text x="100" y="455" class="t body">outreach, imports,</text>
    <text x="100" y="495" class="t body">and public actions.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="260" width="290" height="250" rx="28" fill="#fff"/>
    <rect x="390" y="260" width="290" height="12" rx="6" fill="#c71f37"/>
    <text x="420" y="325" class="h label">Tony Stark</text>
    <text x="420" y="363" class="mono small">hermes-prime</text>
    <text x="420" y="415" class="t body">Write-capable</text>
    <text x="420" y="455" class="t body">workflow lead.</text>
    <text x="420" y="495" class="t body">GPT-5.6 stack.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="260" width="290" height="250" rx="28" fill="#fff"/>
    <rect x="710" y="260" width="290" height="12" rx="6" fill="#4f2f8f"/>
    <text x="740" y="325" class="h label">Thor</text>
    <text x="740" y="363" class="mono small">hermes-legacy</text>
    <text x="740" y="415" class="t body">Read-only backup</text>
    <text x="740" y="455" class="t body">reviewer.</text>
    <text x="740" y="495" class="t body">OpenRouter/Kimi.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="260" width="300" height="250" rx="28" fill="#fff"/>
    <rect x="1030" y="260" width="300" height="12" rx="6" fill="#1d7f50"/>
    <text x="1060" y="325" class="h label">Captain</text>
    <text x="1060" y="363" class="h label">America</text>
    <text x="1060" y="401" class="mono small">Automation layer</text>
    <text x="1060" y="455" class="t body">Cron, LaunchAgents,</text>
    <text x="1060" y="495" class="t body">watchers, scripts.</text>
  </g>

  <text x="70" y="595" class="title" font-size="46">Primary Approval Flow</text>
  <g filter="url(#shadow)">
    <rect x="70" y="635" width="240" height="180" rx="25" fill="url(#blue)"/>
    <text x="100" y="700" class="w label">Task</text>
    <text x="100" y="745" class="w small">Inbox file, schedule,</text>
    <text x="100" y="780" class="w small">or Mike request.</text>

    <rect x="335" y="635" width="240" height="180" rx="25" fill="url(#red)"/>
    <text x="365" y="700" class="w label">Tony</text>
    <text x="365" y="745" class="w small">Drafts, packets,</text>
    <text x="365" y="780" class="w small">internal handoff.</text>

    <rect x="600" y="635" width="240" height="180" rx="25" fill="#4f2f8f"/>
    <text x="630" y="700" class="w label">Uhtred</text>
    <text x="630" y="745" class="w small">Compliance, scope,</text>
    <text x="630" y="780" class="w small">data quality.</text>

    <rect x="865" y="635" width="240" height="180" rx="25" fill="url(#gold)"/>
    <text x="895" y="700" class="h label">Mike Gate</text>
    <text x="895" y="745" class="h small">Approval before</text>
    <text x="895" y="780" class="h small">spend/contact.</text>

    <rect x="1130" y="635" width="200" height="180" rx="25" fill="url(#green)"/>
    <text x="1160" y="700" class="w label">Run</text>
    <text x="1160" y="745" class="w small">Captain America</text>
    <text x="1160" y="780" class="w small">executes.</text>
  </g>

  <text x="70" y="900" class="title" font-size="46">Models</text>
  <rect x="70" y="935" width="1260" height="250" rx="28" fill="#fff" filter="url(#shadow)"/>
  <text x="110" y="1000" class="h body">Tony Stark: GPT-5.6 stack in project docs; profile hermes-prime.</text>
  <text x="110" y="1050" class="h body">Thor: OpenRouter / moonshotai/kimi-k2.6 legacy lane; profile hermes-legacy.</text>
  <text x="110" y="1100" class="h body">Live Hermes default: OpenRouter with moonshotai/kimi-k2.6, 128k context.</text>
  <text x="110" y="1150" class="h body">Fallbacks: groq llama 3.1 8b, gemma 2 9b free, deepseek chat.</text>

  <text x="70" y="1270" class="title" font-size="46">Scheduled Jobs</text>
  <rect x="70" y="1305" width="1260" height="430" rx="28" fill="#fff" filter="url(#shadow)"/>
  <text x="110" y="1365" class="h body">Mon-Fri 6:30 AM — Instagram asset prep</text>
  <text x="110" y="1415" class="h body">Mon-Fri 8:00 AM — Instagram post</text>
  <text x="110" y="1465" class="h body">Mon-Fri 9:15 AM — X approved queue autopost</text>
  <text x="110" y="1515" class="h body">Sunday 8:00 AM — X Sunday research</text>
  <text x="110" y="1565" class="h body">Monday 6:35 AM — Weekly topic research</text>
  <text x="110" y="1615" class="h body">Monday 6:45 AM — Caption rewriter</text>
  <text x="110" y="1665" class="h body">Mon-Fri 9:00 AM — Expired email campaign daily, script mode</text>
  <text x="110" y="1715" class="h body">Daily 9:00 AM — Summer buyer batch, Kimi snapshot</text>

  <text x="70" y="1815" class="title" font-size="38">Rule: if money leaves the account or a human gets contacted, Mike approves first.</text>
</svg>
